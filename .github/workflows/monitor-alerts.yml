name: Poll TTC alerts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ttc-alert-pipeline
  cancel-in-progress: false

jobs:
  poll-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Poll the TTC alert feed
        env:
          FUNCTION_URL: https://qvlphhsgkrvcqvjhqkhg.supabase.co/functions/v1/alerts-poll
          POLL_SECRET: ${{ secrets.ALERTS_POLL_SECRET }}
        run: |
          test -n "$POLL_SECRET"
          curl --fail --silent --show-error --retry 2 --max-time 90 \
            --request POST "$FUNCTION_URL" \
            --header "x-alerts-poll-secret: $POLL_SECRET"

      - name: Deliver queued notifications
        env:
          FUNCTION_URL: https://qvlphhsgkrvcqvjhqkhg.supabase.co/functions/v1/notifications-send
          DELIVERY_SECRET: ${{ secrets.NOTIFICATIONS_SEND_SECRET }}
        run: |
          test -n "$DELIVERY_SECRET"
          curl --fail --silent --show-error --retry 2 --max-time 90 \
            --request POST "$FUNCTION_URL" \
            --header "x-notifications-send-secret: $DELIVERY_SECRET"
